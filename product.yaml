# Tiny Notes governance manifest, read by the Valxel SDLC tool.
# Written from the product brief approved at the product gate; changes are pull requests.
# Repos are added here as features create them (the product architecture lists them).
product_id: TNOTE
name: Tiny Notes
constitution: constitution.md
context: context.md
depends_on: []
runtime:
  openchoreo_project: tnote
  pipeline:
  - dev
  - staging
  - production
  tier: 3
  stage: pilot
  data_planes:
    non_production: tnote-nonprod
    production: tnote-prod
  observability:
    non_production: shared
    production: tnote-observe
budget_usd: 50
# Phase-group shares of a feature's budget (percent, total 100). Documents raised from the 15% default: on the
# subscription lane the architect's Opus session alone outruns 15% of a $25 feature (vx-eval, 2026-11-27).
budget_shares:
  documents: 40
  plan: 5
  build: 35
  fixes: 15
  release: 5
repos: []
repo_prefix: tnote-
# Approvers: elmpp (the eval org has no GitHub teams; product.yaml takes GitHub users/teams only).
approvers:
  g1:
  - elmpp
  g2:
  - elmpp
  g3:
  - elmpp
  g4:
  - elmpp
  g5:
  - elmpp
  security:
  - elmpp
  g6:
  - elmpp
  traceability:
  - elmpp
high_risk_paths:
- src/auth/
- migrations/
